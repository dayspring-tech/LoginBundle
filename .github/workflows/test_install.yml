name: Test Composer Install

on:
  push:

jobs:
  test:

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        symfony:
          - '5.4.x'
          - '6.0.x'
          - '6.1.x'
          - '6.2.x'
          - '6.3.x'
          - '6.4.x'

    steps:
      - name: Use PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, zip
          coverage: xdebug
          tools: composer:v2

      - name: Create project and install dependencies
        run: |
            composer create-project -s dev symfony/skeleton:"${{ matrix.symfony }}" my_project_name 
            cd my_project_name
            composer require dayspring-tech/login-bundle:"dev-${{ github.ref_name }}"
